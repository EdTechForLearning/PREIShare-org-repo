# Scaffold only. Typecheck, build, lint, and test are later steps.
# docs/ci/project-ci-inventory.md does not pin a Node version (no .nvmrc, no engines).
# This file records Node 24, the Active LTS when the workflow was added.
# Package manager is npm. Lockfile is package-lock.json. Do not use pnpm or yarn.

name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci
