# Order: install, typecheck, build, lint, test.
# docs/ci/project-ci-inventory.md does not pin a Node version (no .nvmrc, no engines).
# This file records Node 24, the Active LTS when the workflow was added.
# Package manager is npm. Lockfile is package-lock.json. Do not use pnpm or yarn.
# lint is `tsc --noEmit --pretty false`. test is `node --test` and exits.
# Do not use continue-on-error.

name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, typecheck, build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
